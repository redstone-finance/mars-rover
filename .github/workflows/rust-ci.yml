name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened]
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup
        run: make setup-env

      - name: Checks
        run: make all-checks

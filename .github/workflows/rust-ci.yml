name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize, opened]
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup
        run: make setup-env

      - name: Checks
        run: make all-checks
